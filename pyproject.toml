[project]
name = "snippet-docx"
version = "0.1.0"
description = "Convert a markdown snippet into a house-standard DOCX (ecepdi default; pluggable strategies)"
authors = [
    { name = "Jinxuan Zhu", email = "zhujinxuan@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "python-docx>=1.1.0",
    "jinja2>=3.1.0",
]

[project.scripts]
snippet-docx = "snippet_docx.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "snippet-docx-testhouse",
]

[tool.uv.sources]
snippet-docx-testhouse = { path = "tests/testhouse" }
